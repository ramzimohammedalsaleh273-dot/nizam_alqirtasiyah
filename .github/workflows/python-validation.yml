name: Python validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Reference specification audit
        run: python scripts/reference_spec_audit.py
      - name: Independent whole-project audit
        run: python scripts/final_independent_audit.py
      - name: Install Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libxkbcommon-x11-0
      - name: Prepare test database
        run: |
          python -c "from app.database.connection import get_session; from app.database.schema_bootstrap import ensure_reference_schema; s=get_session(); ensure_reference_schema(s); s.commit(); s.close()"
          python seed_database.py
      - name: Headless UI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/headless_ui_smoke.py
      - name: Full UI windows acceptance
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/ui_windows_acceptance.py
      - name: Enterprise acceptance
        run: python scripts/run_enterprise_acceptance.py
      - name: Operational acceptance
        run: python scripts/run_acceptance_check.py
      - name: Test suite
        run: pytest -q
